name: emosup-linux-amd64-build

on:
  push:
    branches:
      - main
    tags:
      - beta
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-amd64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: goserver/go.mod

      - name: Build linux amd64 binary
        working-directory: goserver
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -o dist/emosup ./cmd/server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emosup
          path: goserver/dist/emosup

      - name: Create or update beta release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: emosup
          prerelease: true
          files: goserver/dist/emosup
          generate_release_notes: true
