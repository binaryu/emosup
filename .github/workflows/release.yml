name: release

# Tag examples:
#   v1.0.0      → stable GitHub Release + Docker
#   beta / beta-1 → prerelease (same pipeline)
on:
  push:
    tags:
      - "v*"
      - "beta"
      - "beta-*"

permissions:
  contents: write
  packages: write

jobs:
  build-binary:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset: emosup-linux-amd64
          - goos: linux
            goarch: arm64
            asset: emosup-linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run backend tests
        if: matrix.goarch == 'amd64'
        working-directory: backend
        run: go test ./...

      - name: Build server binary
        working-directory: backend
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p "../release/${{ matrix.asset }}"
          go build -trimpath \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "../release/${{ matrix.asset }}/emosup-server" \
            ./cmd/server

      - name: Assemble tarball
        shell: bash
        run: |
          set -euo pipefail
          ASSET="${{ matrix.asset }}"
          DEST="release/${ASSET}"
          mkdir -p "${DEST}/frontend" "${DEST}/data/downloads"
          cp -R frontend/dist/. "${DEST}/frontend/"
          cp backend/data/config.example.json "${DEST}/config.example.json"
          cp scripts/emosup.service "${DEST}/emosup.service"
          cp scripts/install.sh "${DEST}/install.sh"
          chmod +x "${DEST}/emosup-server" "${DEST}/install.sh"
          printf '%s\n' "${GITHUB_REF_NAME}" > "${DEST}/VERSION"
          cat > "${DEST}/README.txt" <<EOF
          emosup ${GITHUB_REF_NAME} (${ASSET})

          Quick start:
            1. ./emosup-server
            2. open http://127.0.0.1:8080  (admin / admin)

          Or install as systemd service:
            sudo ./install.sh install --dir /opt/emosup

          Data directory: ./data  (or EMOSUP_DATA_DIR)
          Frontend:       ./frontend  (or EMOSUP_FRONTEND_DIST)
          EOF
          tar -C release -czf "release/${ASSET}.tar.gz" "${ASSET}"
          (cd release && sha256sum "${ASSET}.tar.gz" > "${ASSET}.tar.gz.sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            release/${{ matrix.asset }}.tar.gz
            release/${{ matrix.asset }}.tar.gz.sha256

  publish-release:
    needs: build-binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Detect prerelease
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == beta || "$TAG" == beta-* || "$TAG" == *-beta* || "$TAG" == *-rc* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          ls -la release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            release-assets/*.tar.gz
            release-assets/*.sha256
          body: |
            ## 安装

            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | sudo bash
            ```

            或指定版本 / 目录：

            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | sudo bash -s -- install --version ${{ github.ref_name }}
            ```

            默认账号：`admin` / `admin`  
            面板：`http://服务器IP:8080`

  build-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
