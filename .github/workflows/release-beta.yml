name: release-beta

on:
  push:
    tags:
      - beta
      - beta-*

permissions:
  contents: write
  packages: write

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run backend tests
        working-directory: backend
        run: go test ./...

      - name: Build backend for linux-x64
        working-directory: backend
        env:
          CGO_ENABLED: 0
          GOARCH: amd64
          GOOS: linux
        run: |
          mkdir -p ../release/emosup-linux-x64/backend
          go build -trimpath -ldflags="-s -w" -o ../release/emosup-linux-x64/backend/emosup-server ./cmd/server

      - name: Assemble release bundle
        shell: bash
        run: |
          mkdir -p release/emosup-linux-x64/frontend
          mkdir -p release/emosup-linux-x64/backend/data
          cp -R frontend/dist/. release/emosup-linux-x64/frontend/
          cp backend/data/config.example.json release/emosup-linux-x64/backend/data/config.example.json
          cp README.md release/emosup-linux-x64/README.md
          cp upload.md release/emosup-linux-x64/upload.md
          cat > release/emosup-linux-x64/start-backend.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$(dirname "$0")/backend"
          ./emosup-server
          EOF
          chmod +x release/emosup-linux-x64/start-backend.sh
          tar -C release -czf release/emosup-linux-x64.tar.gz emosup-linux-x64

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: emosup-linux-x64
          path: release/emosup-linux-x64.tar.gz

      - name: Publish GitHub release asset
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: release/emosup-linux-x64.tar.gz

  build-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=sha,format=short,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
