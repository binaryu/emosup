services:
  emosup:
    image: ${EMOSUP_IMAGE:-emosup:latest}
    # Build from local source when the image is not already present.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emosup
    restart: unless-stopped
    # Default to root so bind-mounted data/ dirs work without permission
    # tweaks. For production, set EMOSUP_UID / EMOSUP_GID to a non-root user
    # and chown the data directories accordingly.
    user: "${EMOSUP_UID:-0}:${EMOSUP_GID:-0}"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    ports:
      - "${EMOSUP_PORT:-8080}:8080"
    volumes:
      - ${EMOSUP_DATA_DIR:-./data}:/app/backend/data
      - ${EMOSUP_DOWNLOADS_DIR:-./downloads}:/app/backend/data/downloads
    entrypoint:
      - /bin/sh
      - -ec
      - |
        [ -f /app/backend/data/config.json ] || cp /app/defaults/config.example.json /app/backend/data/config.json || true
        sed -i 's/"host": "127.0.0.1"/"host": "0.0.0.0"/' /app/backend/data/config.json 2>/dev/null || true
        exec /app/backend/emosup-server
