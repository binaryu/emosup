services:
  emosup:
    image: ${EMOSUP_IMAGE:-ghcr.io/binaryu/emosup:beta-20260323-214646}
    container_name: emosup
    restart: unless-stopped
    ports:
      - "${EMOSUP_PORT:-8080}:8080"
    volumes:
      - emosup_data:/app/backend/data
    entrypoint:
      - /bin/sh
      - -lc
    command: >
      if [ ! -f /app/backend/data/config.json ]; then
        cp /app/backend/data/config.example.json /app/backend/data/config.json &&
        sed -i 's/"host": "127.0.0.1"/"host": "0.0.0.0"/' /app/backend/data/config.json;
      fi;
      exec ./emosup-server

volumes:
  emosup_data:
