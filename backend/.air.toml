root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/emosup-server ./cmd/server"
  bin = "./tmp/emosup-server"
  full_bin = ""
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["tmp", "vendor", "data"]
  include_dir = []
  exclude_file = []
  delay = 500
  stop_on_error = true
  kill_delay = "500ms"

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = false
